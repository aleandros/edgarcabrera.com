<header class="header">
  <div class="wrap header__inner">
    <a class="header__name" href="{{ if .IsHome }}#main{{ else }}{{ site.Home.RelPermalink }}{{ end }}" aria-label="Edgar Cabrera, home"><span class="monogram" aria-hidden="true">ec<span> /</span></span>{{ site.Title }}</a>
    <nav class="header__nav" aria-label="Main navigation"><a href="{{ if not .IsHome }}{{ site.Home.RelPermalink }}{{ end }}#services">How I help</a><a href="{{ if not .IsHome }}{{ site.Home.RelPermalink }}{{ end }}#experience">Experience</a></nav>
    <div class="header__actions">
      {{ if site.Params.themeToggle }}<select class="header__theme" data-theme-select aria-label="Color theme">
        <option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option>
      </select>{{ end }}
      {{ if eq .Layout "calendar" }}
      <a class="header__cta" href="{{ site.Home.RelPermalink }}">Back to home {{ partial "arrow.html" "right" }}</a>
      {{ else }}
      <a class="header__cta" href="{{ partial "contact-url.html" . }}">Let’s talk {{ partial "arrow.html" "up-right" }}</a>
      {{ end }}
    </div>
  </div>
</header>

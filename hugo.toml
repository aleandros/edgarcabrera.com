baseURL = 'https://edgarcabrera.com/'
locale = 'en-us'
title = 'Edgar Cabrera'

enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'rss']

[params]
  # Primary CTAs use email until a booking URL is configured. Replace "#" with a
  # scheduling link (Cal.com / SavvyCal / Google Calendar appointment page).
  bookingURL = 'https://calendar.proton.me/u/1/bookings#RBB4jRe63YTrhN1odFSV62BhAjUVxSP6F1g8Tn2zx-I='
  email = 'hello@edgarcabrera.com'
  linkedinURL = 'https://www.linkedin.com/in/edgarcabrera-dev/'
  linkedinLabel = 'linkedin.com/in/edgarcabrera-dev'

  tagline = 'Fractional CTO & platform engineering · ex-Amazon, Y Combinator'
  description = 'Fractional CTO and platform engineer for growing teams. Hands-on technical leadership from Edgar Cabrera: ex-Amazon, Kueski, LandingAI, and CTO of a Y Combinator company.'
  availability = 'Taking one engagement now · 10–20 hrs/week · Remote'

  # Follows the system appearance by default; visitors can choose dark or light.
  # Set false to hide the appearance selector.
  themeToggle = true

  ogImage = '/img/og.png'
  ogImageAlt = 'Edgar Cabrera — Fractional CTO & platform engineering. ex-Amazon · YC CTO. Experience at Amazon, Y Combinator’s MovingLake, and LandingAI.'

[markup.goldmark.renderer]
  unsafe = true

[minify]

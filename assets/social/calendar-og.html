<!doctype html>

<style>
@font-face { font-family: Geist; src: url('../../static/fonts/geist-400-latin.woff2'); font-weight: 400; }
@font-face { font-family: Geist; src: url('../../static/fonts/geist-500-latin.woff2'); font-weight: 500; }
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b1324; color: #edf3ff; font-family: Geist, sans-serif; padding: 54px 72px; position: relative; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(#96bfff09 1px,transparent 1px),linear-gradient(90deg,#96bfff09 1px,transparent 1px); background-size: 60px 60px; pointer-events: none; }
.top { position: relative; display: flex; justify-content: space-between; align-items: center; color: #91a5c3; font-size: 19px; }
.name { color: #edf3ff; font-size: 27px; font-weight: 500; letter-spacing: -.7px; }
.main { position: relative; display: flex; align-items: center; justify-content: space-between; margin-top: 53px; }
.eyebrow { color: #85b5ff; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
h1 { font-size: 88px; line-height: 1.04; font-weight: 500; letter-spacing: -4px; margin: 20px 0 0; }
h1 span { color: #85b5ff; }
.calendar { width: 260px; height: 258px; margin-right: 22px; border: 2px solid #426083; border-radius: 18px; background: #101c32; position: relative; transform: rotate(-5deg); box-shadow: 0 0 90px #387deb22; }
.calendar::before, .calendar::after { content: ''; position: absolute; top: -16px; width: 8px; height: 36px; border-radius: 6px; background: #85b5ff; }
.calendar::before { left: 57px; }.calendar::after { right: 57px; }
.calendar__top { height: 61px; border-bottom: 2px solid #426083; }
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; padding: 27px; }
.days span { width: 35px; height: 32px; border-radius: 5px; background: #234063; }
.days .selected { background: #f2bd79; color: #291b0c; font-size: 27px; line-height: 32px; text-align: center; }
.bottom { position: absolute; bottom: 54px; left: 72px; right: 72px; border-top: 1px solid #2b3a53; padding-top: 27px; display: flex; justify-content: space-between; align-items: center; }
.role { color: #b2bfd4; font-size: 21px; }
.cta { display: flex; gap: 30px; align-items: center; background: #f2bd79; color: #291b0c; font-size: 20px; font-weight: 500; padding: 16px 24px; }
.cta svg { width: 22px; height: 22px; }
</style>
